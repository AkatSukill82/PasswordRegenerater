services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: ["python", "web.py"]
    ports:
      - "3000:8000"
    restart: on-failure
    labels:
      base44.project: "Password generator"
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
